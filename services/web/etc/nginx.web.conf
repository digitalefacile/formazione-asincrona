upstream fcgi_backend {
    zone backend 64k;
    least_conn;
    server unix:/run/php/php-fpm.sock;

    keepalive 20;
}

server {
  listen 80;

  server_tokens off;

  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;

  client_header_timeout   360;
  client_body_timeout     360;
  fastcgi_read_timeout    360;
  keepalive_timeout       360;
  #proxy_ignore_client_abort on;
  send_timeout            360;
  lingering_timeout       360;

  # --- Security Headers ---
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com http://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com http://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;

  add_header Strict-Transport-Security "max-age=10886400; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  # --- End Security Headers ---

  location / {
    root /var/www/html;
    index index.html index.htm index.php;

    error_page 404 /error/index.php;
    error_page 403 =404 /error/index.php;

    absolute_redirect off;
  }

  location ~ [^/]\.php(/|$) {
    root /var/www/html;

    fastcgi_split_path_info  ^(.+\.php)(/.+)$;
    if (!-f $document_root$fastcgi_script_name) {
        return 404;
    }

    fastcgi_index            index.php;
    fastcgi_pass             fcgi_backend;
    include                  fastcgi_params;
    fastcgi_param   PATH_INFO       $fastcgi_path_info;
    fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;

    fastcgi_read_timeout 360;
    fastcgi_send_timeout 360;
    fastcgi_connect_timeout 1200;

    sendfile on;
    client_max_body_size 256M;
  }

  location ~ /\.(?!well-known).* {
    return 404;
  }

  location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
    deny all;
    return 404;
  }

  location /dataroot/ {
    internal;
    alias /var/www/moodledata/;
  }

  location /localdataroot/ {
    internal;
    alias /var/www/localmoodledata/;
  }
}
